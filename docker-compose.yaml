version: "3.9"

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ocei3
      POSTGRES_USER: ocei
      POSTGRES_PASSWORD: ocei
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  flyway:
    image: flyway/flyway:10
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/ocei3
      FLYWAY_USER: ocei
      FLYWAY_PASSWORD: ocei
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      - postgres

  device-seed:
    image: postgres:16
    depends_on:
      - flyway
      - postgres
    volumes:
      - ./db/seeds:/db/seeds
    environment:
      PGPASSWORD: ocei
    entrypoint: >
      sh -c "
      psql -h postgres -U ocei -d ocei3
      -c \"\\copy generic_device(device_id, device_type, alias, client, description, status, timezone, metadata)
           FROM '/db/seeds/devices_v2.csv' CSV HEADER;\"
      "

  ingestor:
    build: ./ingestor
    env_file:
      - .env
    environment:
      DB_DSN: postgres://ocei:ocei@postgres:5432/ocei3
    volumes:
      - ./data:/data
    depends_on:
      - device-seed
    restart: unless-stopped

  api:
    build: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ocei:ocei@postgres:5432/ocei3
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
    ports:
      - "8000:8000"
    depends_on:
      - flyway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres

volumes:
  pgdata:
