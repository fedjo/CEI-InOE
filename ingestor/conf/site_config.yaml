# CEI-InOE Site Configuration
# Loaded on ingestor startup — upserted into the database.
#
# Set ACTIVE_SITE in .env to select which site to activate.
# Valid values: blue_farm | lk_farm | charalambides
# Datasources belonging to the active site are set to "online"; all others remain "offline".

sites:

  blue_farm:
    name: "Blue Farm Dairy"
    location:
      type: Point
      coordinates: [33.4064405, 35.0341770]  # [longitude, latitude]
    site_type: dairy_farm                     # dairy_farm | factory | other
    owner:
      name: "Demo Organisation"
      type: organisation                      # person | organisation
      contact_email: owner@example.com
    administrator_email: admin@example.com
