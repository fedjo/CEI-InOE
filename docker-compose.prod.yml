# docker-compose.prod.yml — pulls pre-built images from GitHub Container Registry
# Usage: IMAGE_TAG=v1.0.0 docker compose -f docker-compose.prod.yml up -d
# IMAGE_TAG defaults to 'latest' (tracks main branch builds)

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ocei}
      POSTGRES_USER: ${DB_USER:-ocei}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ocei}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ocei} -d ${DB_NAME:-ocei}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: ghcr.io/GreenSupplyChain-DIH/cei-inoe-migrations:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ocei}
      DB_USER: ${DB_USER:-ocei}
      DB_PASSWORD: ${DB_PASSWORD:-ocei}
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: on-failure

  ingestor:
    image: ghcr.io/GreenSupplyChain-DIH/cei-inoe-ingestor:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ocei}
      DB_USER: ${DB_USER:-ocei}
      DB_PASSWORD: ${DB_PASSWORD:-ocei}
    volumes:
      - ./data:/data
      - ./shared:/app/shared
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    image: ghcr.io/GreenSupplyChain-DIH/cei-inoe-api:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ocei}
      DB_USER: ${DB_USER:-ocei}
      DB_PASSWORD: ${DB_PASSWORD:-ocei}
      CORS_ORIGINS: ${CORS_ORIGINS:-""}
    ports:
      - "8000:8000"
    volumes:
      - ./shared:/app/shared
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
