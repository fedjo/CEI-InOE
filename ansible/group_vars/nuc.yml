---
# CEI-InOE Deployment Configuration for NUC

# ============================================================================
# Repository Configuration
# ============================================================================
cei_inoe_app_dir: /opt/cei-inoe
cei_inoe_repo_url: git@github.com:fedjo/CEI-InOE.git
cei_inoe_version: main

# ============================================================================
# Service Ports
# ============================================================================
cei_inoe_api_port: 8000
cei_inoe_grafana_port: 3000
cei_inoe_db_port: 5432

# ============================================================================
# Database Configuration
# ============================================================================
cei_inoe_db_name: ocei
cei_inoe_db_user: ocei
cei_inoe_db_password: "{{ vault_cei_inoe_db_password }}"

# ============================================================================
# API Configuration
# ============================================================================
cei_inoe_api_key: "{{ vault_cei_inoe_api_key }}"
cei_inoe_cors_origins:
  - http://100.91.188.28:3000
  - http://100.91.188.28:8000
  - http://localhost:3000
  - http://localhost:5173
  - http://localhost:8080

# ============================================================================
# Worker Configuration
# ============================================================================
cei_inoe_num_workers: 2
cei_inoe_queue_max_size: 100
cei_inoe_log_level: DEBUG

# ============================================================================
# File Connector Configuration
# ============================================================================
cei_inoe_watch_dir: /data/incoming
cei_inoe_processed_dir: /data/processed
cei_inoe_rejected_dir: /data/rejected
cei_inoe_mappings_dir: /app/mappings
cei_inoe_file_poll_interval: 5
cei_inoe_file_stable_seconds: 3

# ============================================================================
# HTTP Energy API Configuration
# ============================================================================
cei_inoe_energy_api_url: "{{ vault_cei_inoe_energy_api_url }}"
cei_inoe_energy_api_key: "{{ vault_cei_inoe_energy_api_key | default('') }}"

# ============================================================================
# Airbeld API Configuration
# ============================================================================
cei_inoe_airbeld_api_url: "{{ vault_cei_inoe_airbeld_api_url }}"
cei_inoe_airbeld_email: "{{ vault_cei_inoe_airbeld_email | default('') }}"
cei_inoe_airbeld_password: "{{ vault_cei_inoe_airbeld_password | default('') }}"
cei_inoe_airbeld_poll_interval: 43200
cei_inoe_airbeld_lookback_days: 7

# ============================================================================
# Tago.io Energy API Configuration
# ============================================================================
cei_inoe_tago_api_url: "{{ vault_cei_inoe_tago_api_url }}"
cei_inoe_tago_enabled: true
cei_inoe_tago_poll_interval: 3600
cei_inoe_tago_lookback_days: 7

# ============================================================================
# FusionSolar API Configuration
# ============================================================================
cei_inoe_fusionsolar_api_url: "{{ vault_cei_inoe_fusionsolar_api_url }}"
cei_inoe_fusionsolar_user: "{{ vault_cei_inoe_fusionsolar_user | default('') }}"
cei_inoe_fusionsolar_system_code: "{{ vault_cei_inoe_fusionsolar_system_code | default('') }}"
cei_inoe_fusionsolar_enabled: true
cei_inoe_fusionsolar_poll_interval: 3600
cei_inoe_fusionsolar_lookback_days: 30

# ============================================================================
# Open-Meteo Forecast API Configuration
# ============================================================================
cei_inoe_openmeteo_enabled: true
cei_inoe_openmeteo_latitude: "{{ vault_cei_inoe_openmeteo_latitude }}"
cei_inoe_openmeteo_longitude: "{{ vault_cei_inoe_openmeteo_longitude }}"
cei_inoe_openmeteo_panel_tilt: 30
cei_inoe_openmeteo_panel_azimuth: 0
cei_inoe_openmeteo_forecast_days: 7
cei_inoe_openmeteo_poll_interval: 3600
cei_inoe_openmeteo_model: best_match
