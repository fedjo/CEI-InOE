version: "3.9"

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ocei3}
      POSTGRES_USER: ${DB_USER:-ocei}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ocei}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ocei} -d ${DB_NAME:-ocei3}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Alembic migrations (replaces Flyway)
  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ocei3}
      DB_USER: ${DB_USER:-ocei}
      DB_PASSWORD: ${DB_PASSWORD:-ocei}
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  # Seed datasources (updated from device seed)
  datasource-seed:
    image: postgres:16
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./db/seeds:/db/seeds
    environment:
      PGPASSWORD: ${DB_PASSWORD:-ocei}
    entrypoint: >
      sh -c "
      psql -h ${DB_HOST:-postgres} -U ${DB_USER:-ocei} -d ${DB_NAME:-ocei3}
      -c \"\\copy datasource(external_id, source_category, data_type, alias, client, description, status, timezone, metadata)
           FROM '/db/seeds/datasources.csv' CSV HEADER;\"
      "

  ingestor:
    build: ./ingestor
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ocei3}
      DB_USER: ${DB_USER:-ocei}
      DB_PASSWORD: ${DB_PASSWORD:-ocei}
    volumes:
      - ./data:/data
      - ./shared:/app/shared
    depends_on:
      datasource-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: ./api
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ocei3}
      DB_USER: ${DB_USER:-ocei}
      DB_PASSWORD: ${DB_PASSWORD:-ocei}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
    ports:
      - "8000:8000"
    volumes:
      - ./shared:/app/shared
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres

volumes:
  pgdata:
